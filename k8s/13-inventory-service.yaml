apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: bizsmart
spec:
  replicas: 2
  selector:
    matchLabels: { app: inventory-service }
  template:
    metadata:
      labels: { app: inventory-service }
    spec:
      containers:
        - name: inventory-service
          image: bizsmart/inventory-service:latest
          ports: [{ containerPort: 3003 }]
          envFrom:
            - configMapRef: { name: bizsmart-config }
          env:
            - name: PORT
              value: "3003"
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: bizsmart-secrets, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bizsmart-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: bizsmart-secrets, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: bizsmart
spec:
  selector: { app: inventory-service }
  ports: [{ port: 3003, targetPort: 3003 }]
