apiVersion: v1
kind: Secret
metadata:
  name: bizsmart-secrets
  namespace: bizsmart
type: Opaque
# Valores de EJEMPLO en base64 ("changeme" / "changeme-super-secret").
# En un entorno real, generar con: echo -n 'valor' | base64
# y NUNCA versionar este archivo con secretos reales (usar un vault o
# sealed-secrets/external-secrets en producción).
stringData:
  DB_USER: "bizsmart"
  DB_PASSWORD: "changeme"
  JWT_SECRET: "changeme-super-secret"
