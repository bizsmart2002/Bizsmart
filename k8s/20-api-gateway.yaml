apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: bizsmart
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: bizsmart/api-gateway:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: bizsmart-config }
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 8
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: bizsmart
spec:
  selector: { app: api-gateway }
  ports: [{ port: 3000, targetPort: 3000 }]
