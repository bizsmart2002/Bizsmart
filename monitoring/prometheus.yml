global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "blackbox-health"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://auth-service:3001/health
          - http://product-service:3002/health
          - http://inventory-service:3003/health
          - http://sales-service:3004/health
          - http://customer-service:3005/health
          - http://reporting-service:3006/health
          - http://ai-service:3007/health
          - http://api-gateway:3000/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115